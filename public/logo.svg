<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" width="100%" height="100%">
  <!-- Top Line: THE CANNA CAFE -->
  <text 
    x="260" 
    y="42" 
    text-anchor="middle" 
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="42" 
    font-weight="800" 
    letter-spacing="7" 
    fill="#E5A93C" 
    stroke="#0A0A0C" 
    stroke-width="1.8" 
    stroke-linejoin="round"
    paint-order="stroke fill">
    THE CANNA CAFE
  </text>

  <!-- Bottom Bar: Black rounded pill with white text -->
  <rect 
    x="10" 
    y="54" 
    width="500" 
    height="32" 
    rx="16" 
    fill="#08080A" 
    stroke="#3E3E46" 
    stroke-width="1.2"
  />

  <!-- Pill Text: LOCATED INSIDE THE HEMP CENTER -->
  <text 
    x="260" 
    y="75.5" 
    text-anchor="middle" 
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="15" 
    font-weight="700" 
    letter-spacing="4.5" 
    fill="#FFFFFF">
    LOCATED INSIDE THE HEMP CENTER
  </text>
</svg>
