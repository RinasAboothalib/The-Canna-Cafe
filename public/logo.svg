<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Top Line: THE CANNA CAFE -->
  <text 
    x="300" 
    y="96" 
    text-anchor="middle" 
    font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
    font-size="44" 
    font-weight="800" 
    letter-spacing="9" 
    fill="#DE9B35" 
    stroke="#101010" 
    stroke-width="1.8" 
    stroke-linejoin="round"
    paint-order="stroke fill"
    filter="url(#subtle-shadow)">
    THE CANNA CAFE
  </text>

  <!-- Bottom Bar: Black rounded pill with white text -->
  <rect 
    x="30" 
    y="126" 
    width="540" 
    height="42" 
    rx="21" 
    fill="#0C0C0E" 
    stroke="#222226" 
    stroke-width="1.5"
  />

  <!-- Pill Text: LOCATED INSIDE THE HEMP CENTER -->
  <text 
    x="300" 
    y="152" 
    text-anchor="middle" 
    font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
    font-size="18" 
    font-weight="700" 
    letter-spacing="5" 
    fill="#FAF8F5">
    LOCATED INSIDE THE HEMP CENTER
  </text>
</svg>
